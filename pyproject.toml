[project]
name = "sms"
version = "0.1.0"
description = "Plateforme EL-IMMEKA SMS"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.3",
    "argon2-cffi>=25.1",
    "redis>=6.0",
    "aio-pika>=9.5",
    "gunicorn>=26.2.0",
    "minio>=7.2.20",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["docs_of_interest", "**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["E402", "F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "workers"]
