# Services d'appui du poste de développement. L'application tourne sur l'hôte
# pendant le lot 1 ; seuls les dépôts de données et le courtier sont ici.
# Les ports ne sont exposés que sur 127.0.0.1.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      SMS_DB: ${POSTGRES_DB}
      SMS_PROPRIETAIRE_USER: ${POSTGRES_PROPRIETAIRE_USER}
      SMS_PROPRIETAIRE_PASSWORD: ${POSTGRES_PROPRIETAIRE_PASSWORD}
      SMS_APP_USER: ${POSTGRES_APP_USER}
      SMS_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      SMS_WORKER_USER: ${POSTGRES_WORKER_USER}
      SMS_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD}
      SMS_BACKOFFICE_USER: ${POSTGRES_BACKOFFICE_USER}
      SMS_BACKOFFICE_PASSWORD: ${POSTGRES_BACKOFFICE_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${SMS_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # Nom d'hôte fixe : RabbitMQ range ses données sous le nom de son nœud, tiré
    # du nom d'hôte. Sans lui, recréer le conteneur change de nœud et fait perdre
    # hôtes virtuels, files et droits, alors même que le volume est conservé.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_CONSOLE_PORT}:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - ./docker/rabbitmq/10-jasmin.conf:/etc/rabbitmq/conf.d/10-jasmin.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # MinIO ne publie plus d'image publique sur Docker Hub ni sur quay.io.
    # L'image Chainguard est publique et embarque mc, utilisé par le contrôle
    # de santé. Elle se remplace par MINIO_IMAGE dans le fichier .env.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Passerelle SMS et simulateur de SMSC (lot 2). Profil « passerelle » :
  #   docker compose --profile passerelle up -d
  # SMPPSim (Selenium Software), empaqueté par les auteurs de Jasmin. Comptes
  # smppclient1 à 3, mot de passe « password ». Accusés réalistes : 90 % livrés,
  # 6 % non livrables, 2 % acceptés, 2 % rejetés, en moins de 13 secondes.
  # ukarim/smscsim a été écarté : son service_type de sept caractères viole
  # SMPP 3.4, et Jasmin refuse ses accusés.
  smsc:
    image: jookies/smppsim:1.0.1
    profiles: ["passerelle"]
    ports:
      - "127.0.0.1:${SMSC_WEB_PORT}:89"

  jasmin:
    image: jookies/jasmin:0.11.0
    profiles: ["passerelle"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      smsc:
        condition: service_started
    entrypoint: ["/bin/bash", "/opt/sms/demarrer.sh"]
    # Pour relayer les accusés vers la plateforme lancée sur l'hôte, y compris
    # sous Linux, où ce nom n'existe pas d'office.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_CLIENT_HOST: redis
      REDIS_CLIENT_PORT: "6379"
      REDIS_CLIENT_DBID: "2"
      AMQP_BROKER_HOST: rabbitmq
      AMQP_BROKER_PORT: "5672"
      AMQP_BROKER_USER: ${RABBITMQ_USER}
      AMQP_BROKER_PASSWORD: ${RABBITMQ_PASSWORD}
      JCLI_USER: ${JASMIN_JCLI_USER}
      JCLI_PASSWORD: ${JASMIN_JCLI_PASSWORD}
    volumes:
      - ./docker/jasmin/demarrer.sh:/opt/sms/demarrer.sh:ro
      # Configuration enregistrée par la console (persist), rechargée au démarrage.
      - jasmin_store:/etc/jasmin/store
    ports:
      - "127.0.0.1:${JASMIN_JCLI_PORT}:8990"
      - "127.0.0.1:${JASMIN_HTTP_PORT}:1401"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('127.0.0.1', 8990), 2)\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres:
  redis:
  rabbitmq:
  minio:
  jasmin_store:
