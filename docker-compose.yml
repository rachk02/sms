# Services d'appui du poste de développement. L'application tourne sur l'hôte
# pendant le lot 1 ; seuls les dépôts de données et le courtier sont ici.
# Les ports ne sont exposés que sur 127.0.0.1.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      SMS_DB: ${POSTGRES_DB}
      SMS_PROPRIETAIRE_USER: ${POSTGRES_PROPRIETAIRE_USER}
      SMS_PROPRIETAIRE_PASSWORD: ${POSTGRES_PROPRIETAIRE_PASSWORD}
      SMS_APP_USER: ${POSTGRES_APP_USER}
      SMS_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      SMS_WORKER_USER: ${POSTGRES_WORKER_USER}
      SMS_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${SMS_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_CONSOLE_PORT}:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # MinIO ne publie plus d'image publique sur Docker Hub ni sur quay.io.
    # L'image Chainguard est publique et embarque mc, utilisé par le contrôle
    # de santé. Elle se remplace par MINIO_IMAGE dans le fichier .env.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
  redis:
  rabbitmq:
  minio:
