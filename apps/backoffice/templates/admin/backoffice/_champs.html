{% if formulaire.non_field_errors %}<div class="errornote">{{ formulaire.non_field_errors }}</div>{% endif %}
<fieldset class="module aligned">
  {% for champ in formulaire %}
    <div class="form-row{% if champ.errors %} errors{% endif %}">
      {{ champ.errors }}
      <div class="flex-container">{{ champ.label_tag }} {{ champ }}</div>
      {% if champ.help_text %}<div class="help">{{ champ.help_text }}</div>{% endif %}
    </div>
  {% endfor %}
</fieldset>
