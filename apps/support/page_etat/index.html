<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>État du service EL-IMMEKA SMS</title>
  <style>
    :root { --fond: #f8fafc; --texte: #0f172a; --discret: #475569; --bord: #cbd5e1;
            --ok: #166534; --degrade: #92400e; --panne: #991b1b; --maintenance: #1e40af; }
    @media (prefers-color-scheme: dark) {
      :root { --fond: #0f172a; --texte: #e2e8f0; --discret: #94a3b8; --bord: #334155;
              --ok: #4ade80; --degrade: #fbbf24; --panne: #f87171; --maintenance: #93c5fd; }
    }
    body { margin: 0; background: var(--fond); color: var(--texte);
           font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem; }
    em, i { font-style: normal; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.125rem; margin: 2rem 0 .5rem; }
    h3 { font-size: 1rem; margin: 0 0 .25rem; }
    .discret { color: var(--discret); font-size: .875rem; }
    #bandeau { border: 1px solid var(--degrade); color: var(--degrade); padding: .75rem;
               border-radius: 4px; margin: 1rem 0; }
    #composants { list-style: none; padding: 0; margin: 0; border: 1px solid var(--bord);
                  border-radius: 4px; }
    .composant { display: flex; justify-content: space-between; gap: 1rem; padding: .75rem 1rem;
                 border-top: 1px solid var(--bord); }
    .composant:first-child { border-top: 0; }
    .operationnel strong { color: var(--ok); }
    .degrade strong { color: var(--degrade); }
    .panne strong { color: var(--panne); }
    .maintenance strong { color: var(--maintenance); }
    .incident { border: 1px solid var(--bord); border-radius: 4px; padding: .75rem 1rem;
                margin-bottom: .5rem; }
  </style>
</head>
<body>
  <main>
    <h1>État du service EL-IMMEKA SMS</h1>
    <p id="genere" class="discret">Chargement de l'état.</p>
    <p id="bandeau" role="status" hidden></p>
    <ul id="composants"></ul>
    <h2>Incidents en cours</h2>
    <div id="en-cours"></div>
    <h2>Maintenances prévues</h2>
    <div id="prevues"></div>
    <h2>Historique des quatre-vingt-dix derniers jours</h2>
    <div id="historique"></div>
  </main>
  <script>
/* SCRIPT */
  </script>
</body>
</html>
