# Jasmin 0.11 déclare des files transitoires non exclusives, que RabbitMQ 4
# refuse par défaut (fonctionnalité dépréciée). Elles sont réautorisées ici pour
# Jasmin seul : les files de la plateforme sont toutes durables. RabbitMQ a
# annoncé le retrait de cette fonctionnalité dans une version majeure à venir :
# ce jour-là, Jasmin ne démarrera plus sans correctif. Voir la note de décision
# sur la passerelle (docs/decisions/passerelle-jasmin.md).
deprecated_features.permit.transient_nonexcl_queues = true
