{% extends "base.html" %}
{% block contenu %}
<div class="mx-auto max-w-sm rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
  <h1 class="mb-2 text-xl font-semibold">Second facteur</h1>
  <p class="mb-4 text-sm text-slate-600">Entrez le code de votre application, ou l'un de vos codes de secours.</p>
  {% if erreur %}<p class="mb-3 rounded bg-red-50 px-3 py-2 text-sm text-red-800" role="alert">{{ erreur }}</p>{% endif %}
  <form method="post" class="space-y-3">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ suivant }}">
    <input name="code" autocomplete="one-time-code" required autofocus
           class="w-full rounded border border-slate-300 px-3 py-2 text-center font-mono">
    <button type="submit" class="w-full rounded bg-slate-900 px-4 py-2 text-white">Valider</button>
  </form>
</div>
{% endblock %}
