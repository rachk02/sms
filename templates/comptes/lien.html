{% extends "base.html" %}
{% block contenu %}
<div class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
  <h1 class="mb-3 text-xl font-semibold">{{ titre }}</h1>
  <p class="mb-4 text-sm">{{ message }}</p>
  {% if renvoi %}
    <form method="post" action="{% url 'renvoi' %}" class="space-y-3">
      {% csrf_token %}
      <label class="block text-sm">Recevoir un nouveau lien à l'adresse
        <input type="email" name="courriel" required class="mt-1 w-full rounded border border-slate-300 px-3 py-2">
      </label>
      <button type="submit" class="rounded bg-slate-900 px-4 py-2 text-white">Renvoyer le lien</button>
    </form>
  {% endif %}
  <p class="mt-4 text-sm"><a class="underline" href="{% url 'connexion' %}">Aller à la connexion</a></p>
</div>
{% endblock %}
