{{ table_encodage|json_script:"table-encodage" }}
{{ replis|json_script:"replis-declares" }}
{{ saisie.texte|json_script:"texte-initial" }}
<div x-data="compositeur('table-encodage', 'replis-declares', 'texte-initial')" class="space-y-2">
  {% if erreur %}<p class="rounded bg-red-50 px-3 py-2 text-sm text-red-800" role="alert">{{ erreur }}</p>{% endif %}
  <label class="flex flex-col text-sm">Nom du modèle
    <input name="nom" value="{{ saisie.nom }}" required maxlength="150" class="rounded border border-slate-300 px-2 py-1">
  </label>
  <label class="flex flex-col text-sm">Message
    <textarea name="texte" rows="6" required x-model="texte"
              class="rounded border border-slate-300 px-2 py-1 font-mono">{{ saisie.texte }}</textarea>
  </label>
  {% include "campagnes/_compteur.html" %}
</div>
